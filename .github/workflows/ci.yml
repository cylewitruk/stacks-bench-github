name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install pinned Rust toolchain
        run: |
          # With no explicit argument, rustup installs the active toolchain
          # selected by rust-toolchain.toml, including its profile/components.
          rustup toolchain install
          rustup show active-toolchain

      - name: Install repository tools
        uses: taiki-e/install-action@v2.77.5
        with:
          tool: just@1.46.0,nextest@0.9.137,cargo-machete@0.9.2

      - name: Validate protobuf schema
        uses: bufbuild/buf-action@v1.4.0
        with:
          version: "1.69.0"
          input: proto
          format: false
          lint: true
          breaking: false
          push: false
          archive: false
          pr_comment: false

      - name: Build
        run: just build --no-sccache

      - name: Lint and repository checks
        run: just lint --no-sccache

      # The standard test entry point starts the compose-managed Postgres and
      # MinIO fixtures used by the integration-test tier.
      - name: "Test (Docker: Postgres + MinIO)"
        run: just test --summary --no-sccache
