[workspace]
resolver = "3"
members = [
    "crates/sbgh-core",
    "crates/sbgh-api",
    "crates/sbgh-fleet",
    "crates/sbgh-proto",
    "crates/sbgh-driver",
    "crates/sbgh-libvirt",
    "crates/sbgh-worker",
    "crates/sbgh-postgres",
    "crates/sbgh-github",
    "crates/sbgh-intent",
    "crates/sbgh-slack",
    "crates/sbgh-handler",
    "crates/sbgh-cli",
    "crates/sbgh-daemon",
    "crates/sbgh-smee",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cylewitruk/stacks-bench-github"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
sbgh-core = { path = "crates/sbgh-core" }
sbgh-api = { path = "crates/sbgh-api" }
sbgh-fleet = { path = "crates/sbgh-fleet" }
sbgh-proto = { path = "crates/sbgh-proto" }
sbgh-driver = { path = "crates/sbgh-driver" }
sbgh-libvirt = { path = "crates/sbgh-libvirt" }
sbgh-worker = { path = "crates/sbgh-worker" }
sbgh-postgres = { path = "crates/sbgh-postgres" }
sbgh-github = { path = "crates/sbgh-github" }
sbgh-intent = { path = "crates/sbgh-intent" }
sbgh-slack = { path = "crates/sbgh-slack" }

# Async runtime
tokio = { version = "1.52.3", default-features = false }
# `io` for ReaderStream used by streaming artifact uploads.
tokio-util = { version = "0.7.18", features = ["io"] }
async-trait = "0.1.89"
futures = "0.3.32"
tokio-stream = { version = "0.1.17", features = ["net"] }

# HTTP / web
axum = { version = "0.8.9", features = ["macros"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "limit", "timeout"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
reqwest = { version = "0.13.4", default-features = false }
prost = "0.14.4"
tonic = { version = "=0.14.5", default-features = false, features = [
    "codegen",
    "transport",
    "tls-ring",
] }
tonic-prost = "=0.14.5"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "=0.14.5"
# S3-compatible object storage for run artifacts. Sans-IO (pure
# SigV4 signing + request building); driven by reqwest.
rusty-s3 = "0.9.1"

# GitHub
octocrab = "0.53.1"
jsonwebtoken = "10.4.0"

# Socket Mode client for the Slack ad-hoc profiling connector. The
# `hyper` feature pulls the WS listener (tokio-tungstenite) + Web API client,
# all rustls/ring-aligned with our stack; the `axum` feature (Events-API HTTP
# push) is deliberately NOT enabled — Socket Mode is an outbound WebSocket.
slack-morphism = { version = "2.22.0", default-features = false, features = [
    "hyper",
] }
# Crypto / hashing for webhook signature verification
hmac = "0.13.0"
sha2 = "0.11.0"
libc = "0.2"
subtle = "2.6.1"
hex = "0.4.3"
base64 = "0.22.1"

# Database
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid",
    "json",
    "migrate",
] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
# `preserve_order` is critical for sbgh-smee: it forwards GitHub webhook
# payloads, and the receiver verifies HMAC against the body bytes. If we
# re-serialize JSON with keys in alphabetical order, the byte stream differs
# from what GitHub originally sent and HMAC fails. preserve_order keeps the
# insertion order through the round-trip, matching V8's behaviour that
# upstream smee-client relies on.
serde_json = { version = "1.0.150", features = ["preserve_order"] }
schemars = "1.2.1"

# Errors
thiserror = "2.0.18"
anyhow = "1.0.102"

# Logging / tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1.23.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = [
    "serde",
    "clock",
] }
dotenvy = "0.15"
url = "2.5.8"
percent-encoding = "2.3.2"
toml = "1.1.2"
quick-xml = "0.40"
reqwest-eventsource = "0.6.0"
clap = { version = "4.6.1", features = ["derive"] }
regex = "1.12.4"
# TLS: the dep tree unifies both rustls providers (`aws-lc-rs` via reqwest,
# `ring` via slack-morphism/sqlx), so the process-level default is ambiguous and
# rustls panics on the first handshake. Each binary installs `ring` explicitly at
# the beginning of its `main` function.
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26.4"
rustls-pemfile = "2.2.0"
x509-parser = "0.18.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 8
opt-level = 2
