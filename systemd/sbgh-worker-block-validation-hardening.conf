# Install as:
# /etc/systemd/system/sbgh-worker@block-validation.service.d/hardening.conf
# The configured chainstate is an LVM origin, not a host directory.
[Service]
# The trusted adapter invokes a narrow sudo allowlist and talks to libvirt.
NoNewPrivileges=false
RestrictSUIDSGID=false
PrivateDevices=false
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictNamespaces=true
ReadWritePaths=/var/lib/sbgh-worker /run/sbgh-worker
ReadOnlyPaths=/etc/sbgh/worker
