# Install as:
# /etc/systemd/system/sbgh-worker@block-validation.service.d/hardening.conf
# Adjust the writable paths to the measured host layout.
[Service]
NoNewPrivileges=true
RestrictSUIDSGID=true
PrivateDevices=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictNamespaces=true
ReadWritePaths=/var/lib/sbgh-worker /srv/sbgh/workspaces
ReadOnlyPaths=/srv/sbgh/datasets /etc/sbgh/worker
