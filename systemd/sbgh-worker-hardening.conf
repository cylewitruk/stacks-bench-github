# Installed globally as:
# /etc/systemd/system/sbgh-worker@.service.d/hardening.conf
# Every recipe executes untrusted repository code inside a VM, while this
# trusted host adapter retains only the paths and host commands it needs.
[Service]
# The worker's per-attempt tmpfs is exported to the VM by libvirt/virtiofsd.
# Filesystem-protection directives such as ProtectSystem, ProtectHome,
# PrivateTmp, and ReadWritePaths create a private mount namespace: mounts made
# by the worker then become invisible to libvirt. Keep mount namespaces shared
# and apply only controls which preserve that visibility contract.
RestrictNamespaces=true
