# Installed globally as:
# /etc/systemd/system/sbgh-worker@.service.d/hardening.conf
# Every recipe executes untrusted repository code inside a VM, while this
# trusted host adapter retains only the paths and host commands it needs.
[Service]
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictNamespaces=true
ReadWritePaths=/var/lib/sbgh-worker /run/sbgh-worker
ReadOnlyPaths=/etc/sbgh/worker

