orchestrator_url = "https://fleet.internal.example:9443"
identity_private_key = "/etc/sbgh/worker/client.key"

[binary_cache]
enabled = true
max_bytes = 53687091200
dir = "/var/lib/sbgh-worker/binary-cache"

[sandbox]
service_user = "sbgh-worker"
host_cpus = "48-63"
golden_image = "/var/lib/libvirt/images/sbgh-golden-ubuntu24.qcow2"
boot_disk_gib = 64

[workspace]
jobs_dir = "/var/lib/sbgh-worker/jobs"
git_mirror = "/var/lib/sbgh-worker/git/stacks-core.git"
results_tmpfs_root = "/run/sbgh-worker/jobs"
results_archive_dir = "/var/lib/sbgh-worker/results"

[commands]
virsh = "/usr/bin/virsh"
sudo = "/usr/bin/sudo"
qemu_img = "/usr/bin/qemu-img"
cloud_localds = "/usr/bin/cloud-localds"
git = "/usr/bin/git"

[lvm]
vg_name = "vg0"
thinpool = "thinpool"
chainstate_base_prefix = "mainnet-"
# Shared setup-health guard for every thin-snapshot workload. These fixed
# floors reject an already near-full/mis-provisioned pool; they do not scale
# with shard count.
min_data_free_percent = 5.0
min_metadata_free_percent = 5.0

[block_validation]
vcpus = 48
memory_bytes = 206158430208
cpu_set = "0-47"
max_shards = 48
max_concurrency = 48
max_parallel_jobs = 1
results_tmpfs_mib = 5120
# This file is copied into the guest. It must contain no reusable worker,
# fleet, database, object-store, or repository credentials.
chain_config = "/etc/sbgh/worker/stacks-inspect-mainnet.toml"
snapshot_prefix = "sbgh-block"
mount_options = ["nouuid", "noatime"]
