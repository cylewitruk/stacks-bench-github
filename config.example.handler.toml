# Example handler config. Copy to /etc/sbgh/handler/config.toml (or wherever
# $SBGH_CONFIG points) and fill in.
#
# The handler holds **no** GitHub App credentials and **no** database access
# — only the webhook HMAC secret and the daemon `/api` URL + ingest
# token. App-side identity (client_id, private key) and all persistence live
# in the daemon (see config.example.daemon.toml).
#
# Secret values can also come from env:
#   SBGH_API_URL            — overrides [api].url
#   SBGH_API_INGEST_TOKEN   — sets the ingest token (env-only; never in TOML)
#   SBGH_WEBHOOK_SECRET     — overrides [webhook].secret
# The compose stack sources SBGH_WEBHOOK_SECRET and SBGH_API_INGEST_TOKEN
# from secrets.env so neither lands in this file.

[server]
bind_addr = "0.0.0.0:8080"

[api]
# Base URL of the daemon /api. The handler runs in a container and the
# daemon on the host, so reach it via the docker host gateway. The
# compose stack sets this via SBGH_API_URL.
url = "http://host.docker.internal:8787"
# ingest_token is env-only (SBGH_API_INGEST_TOKEN) — a key here is rejected.

[webhook]
# Set via secrets.env in the deployed stack — leave commented here.
# secret = "<openssl rand -hex 32>"

# Note: the handler no longer has an authorization allowlist. Who may
# trigger benchmarks is enforced by the daemon (DB-backed
# installer/repo/policy/user allowlists managed via `sbgh-cli`), not here.
