# One worker process may execute every current recipe. Presence of [benchmark]
# advertises benchmark + build_only; [block_validation] adds block_validation.
# The daemon registry remains the authorization ceiling for all three.
orchestrator_url = "https://fleet.internal.example:9443"
identity_private_key = "/etc/sbgh/worker/identity.key"

[binary_cache]
enabled = true
max_bytes = 53687091200
dir = "/var/lib/sbgh-worker/binary-cache"

[sandbox]
service_user = "sbgh-worker"
# Reserve these host CPUs for QEMU emulator/I/O threads when an assignment also
# supplies a guest-vCPU cpuset. Tune after host characterization.
host_cpus = "48-63"
golden_image = "/var/lib/libvirt/images/sbgh-golden-ubuntu24.qcow2"
boot_disk_gib = 64

[workspace]
jobs_dir = "/var/lib/sbgh-worker/jobs"
git_mirror = "/var/lib/sbgh-worker/git/stacks-core.git"
results_tmpfs_root = "/run/sbgh-worker/jobs"
results_archive_dir = "/var/lib/sbgh-worker/results"

[commands]
virsh = "/usr/bin/virsh"
sudo = "/usr/bin/sudo"
qemu_img = "/usr/bin/qemu-img"
cloud_localds = "/usr/bin/cloud-localds"
git = "/usr/bin/git"

[lvm]
vg_name = "vg0"
thinpool = "thinpool"
chainstate_base_prefix = "mainnet-"
# Shared setup-health floors reject a near-full or mis-provisioned pool. They
# are not per-assignment write predictions.
min_data_free_percent = 5.0
min_metadata_free_percent = 5.0

[benchmark]
build_vcpus = 4
bench_vcpus = 2
build_memory_bytes = 17179869184
bench_memory_bytes = 8589934592
job_timeout_secs = 21600

[block_validation]
vcpus = 48
memory_bytes = 206158430208
cpu_set = "0-47"
target_blocks_per_shard = 25000
max_shards = 48
max_concurrency = 48
max_parallel_jobs = 1
results_tmpfs_mib = 5120
snapshot_prefix = "sbgh-block"
mount_options = ["nouuid", "noatime"]

