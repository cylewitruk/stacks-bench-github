# Workspace nextest config.
#
# Every DB-backed suite uses `setup_pg_db()`
# (crates/sbgh-core/src/db/test_support.rs): one shared, compose-managed
# Postgres (the `postgres` setup script) with a fresh, migrated database per
# test. Schema isolation per test is all any suite needs — the role split
# that once forced per-test containers was removed in roadmap-v3 Phase 6.
#
# Filters are package-scoped on purpose: new DB tests in these crates are
# covered automatically — no per-binary list to keep in sync.

nextest-version = { required = "0.9.98", recommended = "0.9.137" }
experimental = ["setup-scripts"]

[profile.default]
# Surface the whole picture across the DB suites rather than stopping at the
# first failure. (`fail-fast` lives on the profile, not an override.)
fail-fast = false

[scripts.setup.postgres]
# Idempotent: a no-op when the container is already up, recreated by compose
# only when this file changes. No `--force-recreate` — each test drops its
# own database via the `TestDb` guard, so databases don't accumulate and the
# server doesn't need wiping between runs (which also keeps targeted runs
# fast and avoids orphaning anonymous volumes). `--wait` blocks until the
# healthcheck passes so the server accepts connections before any test runs.
command = "docker compose -f docker/docker-compose.test.yml up --wait -d postgres"

[scripts.setup.minio]
# S3-compatible object storage for the artifact-store live round-trip test
# (sbgh-daemon only). Idempotent `up`; the MinIO image ships its own
# healthcheck, so `--wait` blocks until it's ready before any test runs.
command = "docker compose -f docker/docker-compose.test.yml up --wait -d minio"

# Shared Postgres for the packages whose suites touch the DB. Package-scoped
# so new DB tests are covered without editing a list; a unit test in these
# crates just triggers a (cheap, idempotent) `up` it doesn't use.
[[profile.default.scripts]]
filter = "package(=sbgh-core) | package(=sbgh-cli) | package(=sbgh-daemon)"
setup = "postgres"

# MinIO for the S3 round-trip test. Scoped to that one integration-test binary,
# so unrelated targeted daemon-test runs don't pull/start MinIO — only a run
# that includes `s3_round_trip` does.
[[profile.default.scripts]]
filter = "binary(=s3_round_trip)"
setup = "minio"

# A couple of retries for the DB-backed packages — transient shared-server
# hiccups. Harmless on the deterministic unit tests in the same crates: they
# don't flake, so they don't retry.
[[profile.default.overrides]]
filter = "package(=sbgh-core) | package(=sbgh-cli) | package(=sbgh-daemon)"
retries = 2
