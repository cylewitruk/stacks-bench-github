orchestrator_url = "https://fleet.internal.example:9443"
identity_private_key = "/etc/sbgh/worker/identity.key"

[binary_cache]
enabled = true
max_bytes = 53687091200
dir = "/var/lib/sbgh-worker/binary-cache"

[sandbox]
service_user = "sbgh-worker"
host_cpus = "6-7"
golden_image = "/var/lib/libvirt/images/sbgh-golden-ubuntu24.qcow2"
boot_disk_gib = 64

[benchmark]
build_vcpus = 4
bench_vcpus = 2
build_memory_bytes = 17179869184
bench_memory_bytes = 8589934592
job_timeout_secs = 21600
# Worker-owned isolated CPUs shared by the sequential build and benchmark VMs.
cpu_set = "0-3"

[workspace]
jobs_dir = "/var/lib/sbgh-worker/jobs"
git_mirror = "/var/lib/sbgh-worker/git/stacks-core.git"
results_tmpfs_root = "/run/sbgh-worker/jobs"
results_archive_dir = "/var/lib/sbgh-worker/results"

[commands]
virsh = "/usr/bin/virsh"
sudo = "/usr/bin/sudo"
qemu_img = "/usr/bin/qemu-img"
cloud_localds = "/usr/bin/cloud-localds"
git = "/usr/bin/git"

[lvm]
vg_name = "vg0"
thinpool = "thinpool"
chainstate_base_prefix = "mainnet-"
# Shared setup-health guard for every thin-snapshot workload. These fixed
# floors reject an already near-full/mis-provisioned pool; they do not predict
# per-job write divergence.
min_data_free_percent = 5.0
min_metadata_free_percent = 5.0
