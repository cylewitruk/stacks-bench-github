# Example daemon config. Copy to /etc/sbgh/daemon/config.toml
# (or wherever $SBGH_CONFIG points) and fill in.
#
# The daemon runs ON THE HOST (not in a container) — it needs LVM,
# libvirt, and the golden image. This config holds the GitHub App
# credentials and everything the libvirt benchmark driver needs. Keep
# it disjoint from the handler's config.
#
# Secret values can also come from env:
#   DATABASE_URL                 — overrides [server].database_url
#   SBGH_GH_PRIVATE_KEY_PATH     — overrides [github].private_key_path

[server]
# Connect as the DB **owner** (`sbgh`) — the daemon is the sole DB client.
# roadmap-v3 Phase 3 added the `/api` admin endpoints, which write the
# installer / repo / policy / user tables the old narrow roles had no grants
# on, so the daemon needs owner privileges. (The `sbgh_orch`/`sbgh_handler`
# roles were dropped in the Phase 6 collapse — there's a single role now.)
# Compose publishes postgres on 127.0.0.1:5432; the owner password is the
# `POSTGRES_OWNER_PASSWORD` set in docker/.env.
database_url = "postgres://sbgh:CHANGE_ME@127.0.0.1:5432/sbgh"
# OS user the daemon runs as. Used to chown the per-job source mount.
service_user = "sbgh"

[github]
# App **Client ID** (the `Iv23li...` string in the App settings page, right
# under "About"). Used as the JWT `iss` claim when minting installation
# tokens. Both Client ID and the numeric App ID work today; standardise on
# Client ID per GitHub's 2024 recommendation.
client_id = "Iv23liREPLACE_ME"
api_base_url = "https://api.github.com"
private_key_path = "/etc/sbgh/daemon/github-app.private-key.pem"

[vm]
golden_image = "/var/lib/libvirt/images/sbgh-golden-ubuntu24.qcow2"

# Each job runs the same VM in two phases — build at one size, bench at
# another (typically smaller, matching the production deployment shape).
# Memory accepts the IEC short form: "16G", "8192M", "1024K", or bare
# bytes. All units are binary (G ≡ Gi = 1024³). Between phases the
# daemon powers the VM off cleanly and redefines it at the new
# memory + vcpus, giving the bench phase a fresh kernel boot.
#
# Build phase: cargo wants parallelism and rustc's `lto=fat` final
# link of `stacks-bench` peaks at ~7.6 GiB RSS. 16 GiB is the floor;
# lower OOM-kills the build.
build_vcpus = 4
build_memory = "16G"

# Bench phase: should mirror the production deployment shape so the
# per-block timings are representative. stacks-node typically runs on
# 2–4 cores / 8 GiB in prod.
bench_vcpus = 2
bench_memory = "8G"

boot_disk_gib = 64
job_timeout_secs = 21600   # 6 hours
network = "default"
# How often the daemon polls the in-VM phase journal + virsh
# domstate. Each poll runs a `virsh domstate` subprocess (~50–100ms),
# so smaller values = more host CPU. 5s is the sensible floor for
# our workload; transitions are append-only and replayed in batches
# so we never miss one even at multi-second polls.
poll_interval_secs = 5
# How often the daemon emits a heartbeat log line + (debounced)
# PR-comment refresh showing the current phase and elapsed time
# within it. Independent of poll interval — poll rarely, surface
# liveness frequently.
heartbeat_interval_secs = 60

[paths]
jobs_dir = "/var/lib/sbgh/jobs"
git_mirror = "/var/lib/sbgh/git/stacks-core.git"
results_tmpfs_root = "/run/sbgh/jobs"
results_archive_dir = "/var/lib/sbgh/results"
# Host-side persistent sccache cache, bind-mounted into every job VM
# via virtio-fs. Persists rustc output across jobs so cold cargo
# builds (~35 min) drop to ~5 min on warm cache. sccache enforces its
# own LRU eviction inside the VM (SCCACHE_CACHE_SIZE=20G hardcoded by
# the daemon), so this dir can't exceed that ceiling regardless
# of how many jobs run.
sccache_dir = "/var/lib/sbgh/sccache"
virsh_binary = "/usr/bin/virsh"
sudo_binary = "/usr/bin/sudo"
qemu_img_binary = "/usr/bin/qemu-img"
cloud_localds_binary = "/usr/bin/cloud-localds"
git_binary = "/usr/bin/git"

[lvm]
# Most installs have a single VG that already holds root/swap (often `vg0`
# or named after the hostname). Use whatever `vgs` shows; it does not need
# to be dedicated.
vg_name = "vg0"
thinpool = "thinpool"
chainstate_base_prefix = "mainnet-"
# Leave commented out for the recommended thin-snapshot path (snapshot
# lives in the same thin pool as the origin, grows on demand). Set
# explicitly only if your base chainstate LV is a thick (non-thin) volume —
# the value is then the COW exception-store size in GiB.
# chainstate_snapshot_size_gib = 64

[stacks_bench]
# Default args appended to every `stacks-bench bench run` invocation when
# a PR comment is plain `/benchmark` (no args). When the comment carries
# args, they REPLACE this string entirely — no merging.
#
# The daemon injects the structural flags itself (`--json`, `--db`,
# `bench run`, `--source`, `--dangerous-no-chainstate-copy`); only put
# workload-control flags here. See `stacks-bench bench run --help` for
# the full surface.
#
# The default below is a "smoke test" invocation: replay 5000 mainnet
# blocks starting partway through the chain, with 1000 warmup blocks,
# skipping the slow per-span KV persistence. Completes in tens of
# minutes rather than hours — useful for first-time pipeline validation.
# Tune the start-at / count for your chainstate's height and for what
# you're trying to measure.
default_args = "--start-at 7800000 --count 5000 --warmup 1000 --no-profiler-kv --bench-spans-only"

# The `/api` server (roadmap-v3 Phase 2). Reachable only from the local CLI
# (loopback) and the handler container (docker bridge) — never a public
# interface.
[api]
# TWO binds: loopback for the local CLI, and the docker-bridge gateway IP so
# the handler container can reach the host daemon (a container cannot reach a
# loopback-only bind). The bridge IP is host-specific; firewall it to the
# docker subnet. Default: loopback only. Env: SBGH_API_LISTEN (comma-separated).
listen = ["127.0.0.1:8787", "172.17.0.1:8787"]
# Where the daemon writes the operator `admin` cookie at startup (mode 0600,
# regenerated each boot). `sbgh-cli` reads it. Env: SBGH_API_COOKIE_PATH.
cookie_path = "/etc/sbgh/daemon/.cookie"
# Shared static token the handler presents for the `ingest` scope. Keep it out
# of this file — set it via SBGH_API_INGEST_TOKEN (same value in the handler's
# secrets.env). Unset = webhook submission via /api is disabled.
# ingest_token = "..."

# How benchmark results are surfaced on GitHub (roadmap-v4). Requires the App's
# `checks:write` permission for the check surfaces; until granted, the check
# calls 403 and degrade (PR → comment, baseline → nothing) without failing the
# run — reporting is always non-fatal. (The numeric App id needed for the check
# reconcile is fetched automatically via `GET /app` at startup — no config.)
[reporting]
# PR (`/benchmark`) jobs: "both" (a Check Run on the PR head + a summary comment
# that links to it), "check", or "comment". Default "both".
pr_report = "both"
# Baseline (push/tag) jobs: "check" (a commit-level Check Run on the baseline
# commit) or "none" (headless/DB-only). Default "check".
baseline_report = "check"
# roadmap-v7: the measured per-run coefficient of variation of the combined
# Execution+Commit metric, as a PERCENT (e.g. 0.37 = 0.37% CV). Drives the
# vs-baseline confidence: 1σ on the delta is √2·CV, and the report grades it
# <1σ inconclusive / 1–2σ weak / 2–3σ moderate / ≥3σ likely-real. Leave it unset
# and the PR comment still shows the delta but the confidence reads
# "provisional". This number is HOST-SPECIFIC — re-measure it (e.g. several
# same-commit /benchmark runs, scripts/variance-stats.py) after any change to
# the host/CPU/VM shape, and set it here.
# noise_cv_pct = 0.37

[runner]
# Maximum benchmark jobs run concurrently. Default 1 (sequential — the
# historical behavior). This limits daemon execution *slots*, not VM capacity:
# raise it only when the host can actually run that many jobs at once (each is a
# full build+bench VM today — vCPUs, memory, an LVM snapshot, and a tmpfs per
# job). Values below 1 are clamped to 1.
max_concurrent_jobs = 1

# CPU pinning (optional). One libvirt cpuset per concurrency slot, so each
# concurrent benchmark runs on dedicated physical cores — removing scheduler
# jitter and core-sharing between jobs (essential for trustworthy concurrent
# numbers). Length must be >= max_concurrent_jobs. Omit (or leave empty) to
# disable pinning (vCPUs float across all cores — the default).
#
# Example for a 6-core box (SMT off) running 2 concurrent jobs at 2 vCPUs each,
# leaving cores 4-5 for the host/OS:
#   max_concurrent_jobs = 2
#   cpu_sets   = ["0-1", "2-3"]   # slot 0 → cores 0,1 ; slot 1 → cores 2,3
#   host_cpus  = "4-5"            # pin qemu emulator/I-O threads off the bench cores
# …and match the per-phase vCPU counts to the slot size (a VM's vCPUs are
# CONFINED to its cpuset, so anything above the slot's core count just
# oversubscribes that slot's own cores). For a 2-core slot:
#   [vm]
#   build_vcpus = 2   # the default 4 would oversubscribe a 2-core slot —
#                     # harmless (contained + the build isn't measured) but
#                     # pointless; it can't use more than the slot's cores.
#   bench_vcpus = 2   # keep <= slot cores: the bench phase IS measured, so
#                     # 1 vCPU per core (no oversubscription on the metric).
#
# NOTE: pinning isolates *cores*; it cannot partition the shared L3 / memory
# bandwidth on a single socket. Measure serial-vs-concurrent before trusting
# concurrent results. Pair with a kernel cmdline that keeps the host + managed
# (NVMe/NIC) IRQs off the bench cores:
#   nosmt=force isolcpus=domain,managed_irq,0-3 nohz_full=0-3 rcu_nocbs=0-3
# See docs/host-bringup.md §9 for the full host setup.
# cpu_sets  = ["0-1", "2-3"]
# host_cpus = "4-5"

# Run-artifact storage (item 0001). Default `local` keeps artifacts on the
# orchestrator's disk under [paths].results_archive_dir — today's behavior.
[artifacts]
kind = "local"

# Opt into S3-compatible object storage (e.g. Hetzner) so Slack / the portal can
# fetch artifacts off-box. The local archive is still written as a diagnostic
# breadcrumb + retained copy; S3 is the durable, presigned-fetchable backing,
# and an upload failure never fails the benchmark.
#
#   kind     = "s3"
#   endpoint = "https://fsn1.your-objectstorage.com"
#   bucket   = "sbgh-artifacts"
#   region   = "fsn1"
#
# Credentials are ENV-ONLY (never in this file — a TOML key here is a hard
# error, like [api].ingest_token):
#   SBGH_ARTIFACTS_S3_ACCESS_KEY_ID
#   SBGH_ARTIFACTS_S3_SECRET_ACCESS_KEY
#
# All of the above can also be set via env for a fully env-driven deploy:
#   SBGH_ARTIFACTS_KIND=s3
#   SBGH_ARTIFACTS_S3_ENDPOINT / _BUCKET / _REGION

# Slack ad-hoc profiling connector (item 0002, iteration v5). Disabled by
# default — when off, the connector never starts and the rest of this section is
# inert. Enable it to serve `@sbgh bench …` mention benches over Socket Mode.
[slack]
enabled = false

# When enabled, ALL of the following are required:
#   enabled            = true
#   default_repository = "stacks-network/stacks-core"  # the constant code under test
#   default_rev        = "develop"                      # its default branch/tag/sha
#   allowed_team_ids   = ["T0123ABCD"]                  # allowlisted workspaces (non-empty)
#   allowed_user_ids   = ["U0123ABCD", "U0456WXYZ"]     # allowlisted users (non-empty)
#
# Tokens are ENV-ONLY (never in this file — a TOML key here is a hard error):
#   SBGH_SLACK_APP_TOKEN   # xapp-… (connections:write) — the Socket Mode connection
#   SBGH_SLACK_BOT_TOKEN   # xoxb-… — Web API (chat:write + reactions:write)
#
# See docs/slack-setup.md + docs/slack-app-manifest.yaml to create the app.
#
# All non-secret fields can also come from env for a fully env-driven deploy:
#   SBGH_SLACK_ENABLED=true
#   SBGH_SLACK_DEFAULT_REPOSITORY / _DEFAULT_REV
#   SBGH_SLACK_ALLOWED_TEAM_IDS / _ALLOWED_USER_IDS   # comma-separated
