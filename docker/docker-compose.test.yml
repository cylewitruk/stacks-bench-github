services:
  postgres:
    image: postgres:18-trixie
    container_name: sbgh-test-postgres
    # A test fixture, not a service — don't resurrect it across reboots.
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # One shared server hosts a fresh database per test (see `setup_pg_db()`);
    # raise the connection cap well above the per-test pool size × nextest
    # concurrency so parallel suites don't exhaust it.
    command: ["postgres", "-c", "max_connections=200"]
    # Host-only: the test harness connects on 127.0.0.1:5433. The container
    # port stays the default 5432. The inter-process test-db id sequence is
    # created lazily by `setup_pg_db()` on first use — no init script needed.
    ports:
      - "127.0.0.1:5433:5432"
    # A *named* volume for PGDATA, reused across runs. Each test drops its own
    # database on teardown (the `TestDb` guard), so nothing accumulates here
    # and the container can be reused (idempotent `up`) without a recreate.
    # An anonymous volume would be orphaned on every recreate; this one
    # isn't. To wipe completely: `docker compose -f docker/docker-compose.test.yml down -v`.
    volumes:
      - sbgh-test-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for the artifact-store (`0001`) live
  # round-trip test (crates/sbgh-daemon/tests/s3_round_trip.rs). A test
  # fixture, not a service. Host-only on 127.0.0.1:9100 (→ container 9000) to
  # avoid clashing with a dev's local MinIO on 9000.
  #
  # PINNED, not `:latest`: the MinIO project was archived in 2026 and stopped
  # publishing images after this release, so `RELEASE.2025-09-07T16-13-09Z` is
  # the last/newest stable build — pinning keeps CI reproducible and immune to
  # any future `latest` relicensing/drift. We use only the server's S3 API
  # (path-style PUT/GET/HEAD + SigV4 presigned), which this AGPL release serves
  # fully and which needs no upstream maintenance. The image ships its own
  # HEALTHCHECK, so `up --wait` blocks until it's ready; the test also creates
  # its own bucket (idempotent), so no init container is needed.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: sbgh-test-minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data"]
    ports:
      - "127.0.0.1:9100:9000"
    volumes:
      - sbgh-test-minio:/data

volumes:
  sbgh-test-pgdata:
  sbgh-test-minio:
