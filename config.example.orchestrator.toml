# Example orchestrator config. Copy to /etc/sbgh/orchestrator/config.toml
# (or wherever $SBGH_CONFIG points) and fill in.
#
# The orchestrator runs ON THE HOST (not in a container) — it needs LVM,
# libvirt, and the golden image. This config holds the GitHub App
# credentials and everything the libvirt benchmark driver needs. Keep
# it disjoint from the handler's config.
#
# Secret values can also come from env:
#   DATABASE_URL                 — overrides [server].database_url
#   SBGH_GH_PRIVATE_KEY_PATH     — overrides [github].private_key_path

[server]
# Connect as the narrow `sbgh_orch` role — SELECT + UPDATE on `jobs`.
# Compose publishes postgres on 127.0.0.1:5432; the role password is the
# `SBGH_ORCH_DB_PASSWORD` set in docker/.env.
database_url = "postgres://sbgh_orch:CHANGE_ME@127.0.0.1:5432/sbgh"
# OS user the orchestrator runs as. Used to chown the per-job source mount.
service_user = "sbgh"

[github]
# App **Client ID** (the `Iv23li...` string in the App settings page, right
# under "About"). Used as the JWT `iss` claim when minting installation
# tokens. Both Client ID and the numeric App ID work today; standardise on
# Client ID per GitHub's 2024 recommendation.
client_id = "Iv23liREPLACE_ME"
api_base_url = "https://api.github.com"
private_key_path = "/etc/sbgh/orchestrator/github-app.private-key.pem"

[vm]
golden_image = "/var/lib/libvirt/images/sbgh-golden-ubuntu24.qcow2"
vcpus = 2
memory_gib = 8
boot_disk_gib = 64
job_timeout_secs = 21600   # 6 hours
network = "default"

[paths]
jobs_dir = "/var/lib/sbgh/jobs"
git_mirror = "/var/lib/sbgh/git/stacks-core.git"
results_tmpfs_root = "/run/sbgh/jobs"
results_archive_dir = "/var/lib/sbgh/results"
virsh_binary = "/usr/bin/virsh"
sudo_binary = "/usr/bin/sudo"
qemu_img_binary = "/usr/bin/qemu-img"
cloud_localds_binary = "/usr/bin/cloud-localds"
git_binary = "/usr/bin/git"

[lvm]
# Most installs have a single VG that already holds root/swap (often `vg0`
# or named after the hostname). Use whatever `vgs` shows; it does not need
# to be dedicated.
vg_name = "vg0"
thinpool = "thinpool"
chainstate_base_prefix = "mainnet-"
# Leave commented out for the recommended thin-snapshot path (snapshot
# lives in the same thin pool as the origin, grows on demand). Set
# explicitly only if your base chainstate LV is a thick (non-thin) volume —
# the value is then the COW exception-store size in GiB.
# chainstate_snapshot_size_gib = 64

[stacks_bench]
default_args = ""
