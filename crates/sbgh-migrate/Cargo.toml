[package]
name = "sbgh-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "sbgh_migrate"
path = "src/lib.rs"

[[bin]]
name = "sbgh-migrate"
path = "src/main.rs"

[dependencies]
sbgh-core.workspace = true

tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
clap.workspace = true
dotenvy.workspace = true

[dev-dependencies]
# Re-imports sbgh-core with the `testing` feature so integration tests
# can use the shared setup_pg() helper.
sbgh-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["full", "test-util"] }
serde_json.workspace = true
uuid.workspace = true
