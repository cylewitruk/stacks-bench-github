[package]
name = "sbgh-daemon"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "sbgh-daemon"
path = "src/main.rs"

[dependencies]
sbgh-core.workspace = true
sbgh-api.workspace = true

tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util.workspace = true
async-trait.workspace = true
futures.workspace = true

# Daemon admin and webhook-ingest `/api` server.
axum.workspace = true
tower-http.workspace = true
# Constant-time token comparison in the auth layer.
subtle.workspace = true

serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

thiserror.workspace = true
anyhow.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
rustls.workspace = true

sqlx.workspace = true
dotenvy.workspace = true
uuid.workspace = true
chrono.workspace = true
quick-xml.workspace = true
clap.workspace = true
# S3-compatible artifact storage, driven by Reqwest.
reqwest = { workspace = true, features = ["rustls", "json", "stream"] }
rusty-s3.workspace = true
url.workspace = true
# Regex matching for tag-pattern trigger policies.
regex.workspace = true
# Binary-cache fingerprint hashing and binary-integrity SHA-256;
# `toml` parses `rust-toolchain.toml` for the pinned-channel fingerprint input.
sha2.workspace = true
hex.workspace = true
toml.workspace = true
# Slack ad-hoc profiling connector: Socket Mode client and typed
# Block Kit builders for the result card.
slack-morphism.workspace = true
slack-messaging.workspace = true

[dev-dependencies]
sbgh-core = { workspace = true, features = ["testing"] }
tempfile = "3"
# `oneshot` for driving the axum router in API auth/health tests.
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
# Syntax-aware execution-boundary ratchet; test-only and already present in the
# proc-macro dependency graph.
syn = { version = "2.0.117", features = ["full", "visit"] }
