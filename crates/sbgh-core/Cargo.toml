[package]
name = "sbgh-core"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time"] }
async-trait.workspace = true

sha2.workspace = true
hex.workspace = true

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
anyhow.workspace = true

uuid.workspace = true
chrono.workspace = true
percent-encoding.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }

# sbgh-core's own integration tests need the `testing` feature for the
# in-memory stores. Self-dep is the canonical
# way to enable features only for tests.
sbgh-core = { path = ".", features = ["testing"] }

[features]
# Exposes in-memory / fake implementations of the GitHubApi and JobStore
# traits, plus the shared `setup_pg_db()` Postgres helper, for downstream
# test code. Never enable in release builds. (The helper talks to the
# compose-managed test server started by the nextest setup script — no
# extra deps.)
testing = []
