[package]
name = "sbgh-core"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time"] }
async-trait.workspace = true

sha2.workspace = true
hex.workspace = true

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
anyhow.workspace = true

uuid.workspace = true
chrono.workspace = true
percent-encoding.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }

# sbgh-core's integration tests use the feature-gated GitHub test support.
# A self-dependency is the canonical way to enable features only for tests.
sbgh-core = { path = ".", features = ["testing"] }

[features]
# Exposes the fake GitHub API for downstream test code. Never enable in
# release builds.
testing = []
