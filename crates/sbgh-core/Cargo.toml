[package]
name = "sbgh-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio.workspace = true
async-trait.workspace = true

reqwest.workspace = true
octocrab.workspace = true
jsonwebtoken.workspace = true

hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
hex.workspace = true

sqlx.workspace = true
rustls.workspace = true

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
anyhow.workspace = true

tracing.workspace = true

uuid.workspace = true
chrono.workspace = true
url.workspace = true
percent-encoding.workspace = true
toml.workspace = true
# Slice 5 trigger_policy: regex matching for tag_pattern triggers.
regex.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }

# sbgh-core's own integration tests need the `testing` feature for the
# shared setup_pg_db() helper + in-memory stores. Self-dep is the canonical
# way to enable features only for tests.
sbgh-core = { path = ".", features = ["testing"] }

[features]
# Exposes in-memory / fake implementations of the GitHubApi and JobStore
# traits, plus the shared `setup_pg_db()` Postgres helper, for downstream
# test code. Never enable in release builds. (The helper talks to the
# compose-managed test server started by the nextest setup script — no
# extra deps.)
testing = []
